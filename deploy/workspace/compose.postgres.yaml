services:
  workspace:
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FOLDLY_DATABASE: postgres
      FOLDLY_DATABASE_URL_FILE: /run/secrets/foldly_database_url
    secrets:
      - foldly_database_url

  postgres:
    image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -ec
      - |
        FOLDLY_POSTGRES_APP_PASSWORD=$$(cat /run/secrets/foldly_database_password)
        export FOLDLY_POSTGRES_APP_PASSWORD
        exec docker-entrypoint.sh postgres
    environment:
      POSTGRES_DB: foldly
      POSTGRES_PASSWORD_FILE: /run/secrets/foldly_database_admin
    volumes:
      - foldly_postgres:/var/lib/postgresql/data
      - ./deploy/workspace/postgres-init.sql:/docker-entrypoint-initdb.d/10-foldly.sql:ro
    secrets:
      - foldly_database_admin
      - foldly_database_password
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "foldly", "-d", "foldly"]
      interval: 5s
      timeout: 3s
      retries: 24

volumes:
  foldly_postgres:

secrets:
  foldly_database_admin:
    file: ${FOLDLY_DATABASE_ADMIN_PASSWORD_FILE:-./.secrets/foldly-database-admin}
  foldly_database_password:
    file: ${FOLDLY_DATABASE_PASSWORD_FILE:-./.secrets/foldly-database-password}
  foldly_database_url:
    file: ${FOLDLY_DATABASE_URL_FILE:-./.secrets/foldly-database-url}
