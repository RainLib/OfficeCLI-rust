<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6 -6 76 76" role="img" aria-label="tape sticker"><title>tape</title><style>@keyframes sway{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-2px) rotate(2deg)}}.motion{transform-origin:32px 32px;animation:sway 4.8s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.motion{animation:none}}</style><g class="motion"><rect fill="#F3CE76" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" transform="rotate(-7.448451336700702 32.0 31.0)" x="4" y="15" width="56" height="32" rx="8"/><polyline fill="none" stroke="#D48260" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" points="17,18 12,45"/><polyline fill="none" stroke="#D48260" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" points="28,18 23,45"/><polyline fill="none" stroke="#D48260" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" points="39,18 34,45"/><polyline fill="none" stroke="#D48260" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" points="50,18 45,45"/></g></svg>
