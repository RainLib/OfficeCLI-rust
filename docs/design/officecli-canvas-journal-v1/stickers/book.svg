<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6 -6 76 76" role="img" aria-label="book sticker"><title>book</title><style>@keyframes sway{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-2px) rotate(2deg)}}.motion{transform-origin:32px 32px;animation:sway 4.8s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.motion{animation:none}}</style><g class="motion"><rect fill="#A8C6D5" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" x="8" y="6" width="47" height="53" rx="8"/><rect fill="#D48260" stroke="none" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" x="12" y="7" width="6" height="51" rx="8"/><rect fill="#FFFCF4" stroke="none" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" x="23" y="16" width="25" height="25" rx="8"/><polyline fill="none" stroke="#484439" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="28,23 43,23"/><polyline fill="none" stroke="#484439" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" points="28,30 39,30"/><polyline fill="#E9A2A6" stroke="none" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" points="39,46 46,46 46,59 42,56 39,59 39,46"/></g></svg>
