<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6 -6 76 76" role="img" aria-label="heart sticker"><title>heart</title><style>@keyframes sway{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-2px) rotate(2deg)}}.motion{transform-origin:32px 32px;animation:sway 4.8s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.motion{animation:none}}</style><g class="motion"><polyline fill="#E9A2A6" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" points="32,57 7,31 4,22 7,12 16,8 25,11 32,19 39,11 49,8 58,14 61,23 57,32 32,57"/><ellipse fill="#484439" stroke="none" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" cx="26.5" cy="33.0" rx="1.5" ry="2.0"/><ellipse fill="#484439" stroke="none" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" cx="38.5" cy="33.0" rx="1.5" ry="2.0"/><polyline fill="none" stroke="#484439" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" points="29,40 33,42 37,40"/></g></svg>
