<svg xmlns="http://www.w3.org/2000/svg" viewBox="-7.68 -7.68 79.36 79.36" width="79.36" height="79.36" role="img" aria-label="星点伙伴"><title>星点伙伴</title><style>.canvas-sticker-motion { transform-box: fill-box; transform-origin: center; }
[data-motion=float] .canvas-sticker-motion{animation:sticker-float 4.8s ease-in-out infinite}[data-motion=wiggle] .canvas-sticker-motion{animation:sticker-wiggle 6s ease-in-out infinite}[data-motion=twinkle] .canvas-sticker-motion{animation:sticker-twinkle 4s ease-in-out infinite}
@keyframes sticker-float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-3px) rotate(2deg)}}
@keyframes sticker-wiggle{0%,65%,100%{transform:rotate(0)}72%{transform:rotate(-6deg)}80%{transform:rotate(5deg)}88%{transform:rotate(-3deg)}}
@keyframes sticker-twinkle{0%,100%{transform:scale(.98);opacity:.88}50%{transform:scale(1.05);opacity:1}}
[data-motion=drift] :is([data-sticker-layer=petal-near], [data-sticker-layer=petal-far]) {
  transform-box: fill-box;
  transform-origin: center;
  animation: petal-drift 5.6s ease-in-out infinite;
}
[data-motion=drift] [data-sticker-layer=petal-far] {
  animation: petal-turn 7s ease-in-out infinite;
}
@keyframes petal-drift {
  0%, 100% { transform: translate(-1px,-1px) rotate(-9deg); }
  41% { transform: translate(2.8px,1.6px) rotate(13deg); }
  70% { transform: translate(1px,3.6px) rotate(4deg); }
}
@keyframes petal-turn {
  0%, 100% { transform: translate(0,0) rotate(5deg); }
  54% { transform: translate(-2.2px,3.2px) rotate(-17deg); }
}
[data-motion=flutter] :is([data-sticker-layer=wing-left], [data-sticker-layer=wing-right]) {
  transform-box: view-box;
  transform-origin: 50% 53%;
  animation: sticker-wing 4.8s ease-in-out infinite;
}
[data-motion=flutter] [data-sticker-layer=wing-left] { --wing-tilt: 3deg; }
[data-motion=flutter] [data-sticker-layer=wing-right] { --wing-tilt: -3deg; }
@keyframes sticker-wing {
  0%, 36%, 70%, 100% { transform: scaleX(1); }
  48% { transform: scaleX(.64) rotate(var(--wing-tilt)); }
  59% { transform: scaleX(.90); }
  64% { transform: scaleX(.83); }
}
[data-motion=flight] [data-sticker-layer=plane] {
  transform-box: fill-box;
  transform-origin: 68% 36%;
  animation: sticker-glide 5.4s ease-in-out infinite;
}
[data-motion=flight] [data-sticker-layer=trail] { animation: sticker-trail 5.4s ease-in-out infinite; }
@keyframes sticker-glide {
  0%, 100% { transform: translate(-1px,1px) rotate(-2deg); }
  48% { transform: translate(2.5px,-1.8px) rotate(2deg); }
  78% { transform: translate(.6px,-.6px) rotate(0deg); }
}
@keyframes sticker-trail {
  0%, 100% { stroke-dashoffset: 0; opacity: .82; }
  48% { stroke-dashoffset: -4; opacity: 1; }
}
[data-motion] :is(.canvas-sticker-motion, [data-sticker-layer]) { animation-delay: var(--sticker-phase, 0s); }
[data-motion=blink] [data-sticker-layer=eyes], [data-motion=gleam] [data-sticker-layer=eyes] {
  transform-box: fill-box; transform-origin: center; animation: journal-blink 5.8s ease-in-out infinite;
}
[data-motion=gleam] [data-sticker-layer=glint], [data-motion=glow] [data-sticker-layer=glint], [data-motion=blink] [data-sticker-layer=glint] {
  transform-box: fill-box; transform-origin: center; animation: journal-gleam 4.4s ease-in-out infinite;
}
[data-motion=glow] [data-sticker-layer=lantern] { animation: firefly-glow 4.8s ease-in-out infinite; }
[data-motion=glow] :is([data-sticker-layer=wing-left],[data-sticker-layer=wing-right]) {
  transform-box: view-box; transform-origin: 46% 44%; animation: firefly-hover 4.8s ease-in-out infinite;
}
@keyframes journal-blink { 0%,71%,78%,100% { transform:scaleY(1); } 74% { transform:scaleY(.18); } }
@keyframes journal-gleam { 0%,100% { transform:scale(.78);opacity:.64; } 55% { transform:scale(1.1);opacity:1; } }
@keyframes firefly-glow { 0%,100% { opacity:.57; } 53% { opacity:1; } }
@keyframes firefly-hover { 0%,100% { transform:scaleX(1); } 50% { transform:scaleX(.86); } }
@media (prefers-reduced-motion: reduce), print {
  .canvas-sticker-motion, [data-sticker-layer] { animation: none !important; }
}
[data-paused=true] :is(.canvas-sticker-motion, [data-sticker-layer]) { animation: none !important; }
</style><svg width="64" height="64" viewBox="0 0 64 64" overflow="visible" data-motion="gleam"><g class="canvas-sticker-motion"><g><polyline points="30,9 31.4,7.3 33.1,7.7 35,10 40,22 53,24 54.9,24.8 55.8,26 55.4,27.8 54,30 45,39 47,51 47.1,53.4 46.5,54.8 45.1,54.9 43,54 32,48 21,54 18.5,54.9 17,54.8 16.5,53.4 17,51 19,39 10,30 9.100000000000001,27.8 9.2,26 10.600000000000001,24.8 13,24 25,22 30,9" fill="#EDC478" stroke="#FFFCF4" stroke-width="3" opacity="1" stroke-linejoin="round" stroke-linecap="round"/><polyline points="15,28 25,26 30,16" fill="transparent" stroke="#FFE7B0" stroke-width="2" opacity="1" stroke-linejoin="round" stroke-linecap="round"/></g><g data-sticker-layer="eyes"><ellipse cx="26.1" cy="33.8" rx="1.6" ry="2.3" fill="#51443D" stroke="transparent" stroke-width="0" opacity="1" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="37.6" cy="33.8" rx="1.6" ry="2.3" fill="#51443D" stroke="transparent" stroke-width="0" opacity="1" stroke-linejoin="round" stroke-linecap="round"/></g><g><ellipse cx="22" cy="37.8" rx="3" ry="1.5" fill="#DF9788" stroke="transparent" stroke-width="0" opacity="1" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="41" cy="37.8" rx="3" ry="1.5" fill="#DF9788" stroke="transparent" stroke-width="0" opacity="1" stroke-linejoin="round" stroke-linecap="round"/><polyline points="29,38 31,39.1 33,39.1 35,38" fill="transparent" stroke="#72554C" stroke-width="1.25" opacity="1" stroke-linejoin="round" stroke-linecap="round"/></g><g data-sticker-layer="glint"><polyline points="52,7 53.4,11.3 57.5,13 53.3,14.7 52,19 50.6,14.8 46.5,13 50.5,11.5 52,7" fill="#D69C83" stroke="#FFFCF4" stroke-width="1.3" opacity="1" stroke-linejoin="round" stroke-linecap="round"/></g></g></svg></svg>