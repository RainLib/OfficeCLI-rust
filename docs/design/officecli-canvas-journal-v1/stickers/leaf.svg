<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6 -6 76 76" role="img" aria-label="leaf sticker"><title>leaf</title><style>@keyframes sway{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-2px) rotate(2deg)}}.motion{transform-origin:32px 32px;animation:sway 4.8s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.motion{animation:none}}</style><g class="motion"><polyline fill="none" stroke="#484439" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="32,58 31,23"/><ellipse fill="#99B79C" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" cx="20.0" cy="22.0" rx="13.0" ry="10.0"/><ellipse fill="#99B79C" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" cx="44.5" cy="36.5" rx="13.5" ry="10.5"/><polyline fill="none" stroke="#484439" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round" points="16,22 30,31 44,37"/></g></svg>
