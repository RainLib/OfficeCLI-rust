<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>春日观察手账 · OfficeCLI 白板</title>
    <link rel="stylesheet" href="./workspace.css">
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #faf9f6;
        color: #2d2932;
        font-family:
          -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", "Microsoft YaHei",
          sans-serif;
      }
      #board {
        display: block;
        width: 100vw;
        height: 100dvh;
        touch-action: none;
        user-select: none;
        outline: none;
      }
      #board [data-action] {
        cursor: pointer;
      }
      #board [data-object] {
        cursor: move;
      }
      #board[data-tool="hand"],
      #board[data-tool="hand"] [data-object] {
        cursor: grab;
      }
      #board[data-tool="pan"],
      #board[data-tool="pan"] [data-object] {
        cursor: grabbing;
      }
      #board:is(
        [data-tool="sticky"],
        [data-tool="pen"],
        [data-tool="asset"],
        [data-tool="shape"],
        [data-tool="section"],
        [data-tool="comment"],
        [data-tool="connector"],
        [data-tool="stamp"],
        [data-tool="text"]
      ),
      #board:is([data-tool="stamp"], [data-tool="connector"], [data-tool="pen"]) [data-object] {
        cursor: crosshair;
      }
      #board [data-tool-button]:hover [data-role="tool-bg"] {
        stroke: #cabcdf;
        stroke-width: 1;
      }
      #board [data-action]:focus-visible > .hit {
        stroke: #783fe1;
        stroke-width: 2;
      }
      #board [data-panel] {
        pointer-events: all;
      }
      #menu,
      #editor,
      #source,
      #compose {
        position: fixed;
        z-index: 3;
      }
      #menu,
      #source,
      #compose {
        border: 1px solid #dfdce2;
        border-radius: 14px;
        background: #fff;
        box-shadow: 0 8px 25px #30223e25;
      }
      [hidden] {
        display: none !important;
      }
      #menu {
        min-width: 166px;
        max-width: min(320px, calc(100vw - 20px));
        padding: 7px;
      }
      #menu p {
        font-size: 13px;
        line-height: 1.55;
        color: #665f6b;
        margin: 7px 9px;
      }
      #menu strong {
        display: block;
        font-size: 14px;
        margin: 8px 9px;
      }
      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
      }
      #menu button,
      .item {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border: 0;
        background: #fff;
        border-radius: 7px;
        padding: 8px 10px;
        font-size: 14px;
        text-align: left;
      }
      #menu button:hover,
      .item:hover {
        background: #f3eef8;
      }
      kbd {
        color: #827987;
        font:
          12px ui-monospace,
          monospace;
        margin-left: 24px;
      }
      button:focus-visible,
      textarea:focus-visible,
      input:focus-visible {
        outline: 2px solid #783fe1;
        outline-offset: 2px;
      }
      #menu.palette {
        display: flex;
        gap: 5px;
        min-width: 0;
        padding: 9px;
      }
      #menu .swatch {
        width: 29px;
        height: 29px;
        border: 1px solid #0002;
        border-radius: 50%;
        padding: 0;
      }
      #editor {
        line-height: 1.46;
        font-family: inherit;
        font-weight: 600;
        border: 0;
        outline: 0;
        resize: none;
        background: transparent;
        color: #2d2932;
        padding: 0;
        margin: 0;
        border-radius: 0;
        box-shadow: none;
      }
      #status,
      #hint {
        position: fixed;
        pointer-events: none;
        z-index: 5;
        left: 50%;
        transform: translateX(-50%);
        max-width: 90vw;
        border-radius: 8px;
        font-size: 13px;
        padding: 7px 13px;
        text-align: center;
      }
      #status {
        top: 77px;
        background: #322c39;
        color: #fff;
        box-shadow: 0 3px 9px #33223a26;
      }
      #hint {
        bottom: 102px;
        background: #fff;
        color: #574e60;
        border: 1px solid #e0dbe2;
        box-shadow: 0 3px 8px #352d3b10;
      }
      #source {
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: min(610px, 92vw);
        max-height: 76dvh;
        overflow: auto;
        padding: 24px;
      }
      #source::backdrop {
        background: #26213530;
      }
      #source h2,
      #compose h2 {
        margin: 0;
        font-size: 21px;
        letter-spacing: -0.5px;
      }
      #source .line,
      #compose .line {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      #source p,
      #compose p {
        font-size: 13px;
        color: #6b6672;
      }
      #source textarea,
      #compose textarea {
        display: block;
        width: 100%;
        min-height: 132px;
        resize: vertical;
        font: 16px/1.65 inherit;
        font-family: inherit;
        font-size: 15px;
        line-height: 1.65;
        color: #2d2932;
        padding: 12px;
        border: 1px solid #cdbedc;
        border-radius: 8px;
      }
      #source table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
        margin: 16px 0;
      }
      #source th,
      #source td {
        border: 1px solid #bcb7c3;
        padding: 8px;
        text-align: left;
      }
      #source th {
        background: #e8f2e9;
        font-weight: 600;
      }
      #source .primary,
      #compose .primary {
        border: 0;
        border-radius: 8px;
        background: #783fe1;
        color: #fff;
        margin-top: 14px;
        padding: 9px 14px;
        font-weight: 600;
      }
      .cross {
        border: 0;
        background: #f4f0f5;
        border-radius: 8px;
        width: 30px;
        height: 30px;
        font-size: 20px;
        line-height: 1;
      }
      #compose {
        position: fixed;
        z-index: 3;
        inset: 83px 24px auto auto;
        display: flex;
        flex-direction: column;
        width: min(364px, calc(100vw - 24px));
        height: min(602px, calc(100dvh - 194px));
        padding: 0;
        border: 1px solid #ddd6dd;
        border-radius: 16px;
        background: #fff;
        box-shadow: 0 5px 20px #3521391c;
        overflow: hidden;
      }
      .chat-header {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 13px 15px 12px;
        border-bottom: 1px solid #e9e2ea;
        min-height: 66px;
      }
      #chat-mascot {
        width: 38px;
        height: 38px;
        display: block;
        flex: none;
      }
      #chat-mascot svg {
        width: 100%;
        height: 100%;
      }
      #compose h2 {
        font-family: inherit;
        font-size: 18px;
        line-height: 1.28;
        margin: 0;
        color: #3f3446;
      }
      #chat-provider {
        display: block;
        font-size: 11px;
        margin-top: 2px;
        color: #746978;
      }
      .chat-close {
        margin-left: auto;
        border: 0;
        border-radius: 7px;
        background: transparent;
        color: #766b7b;
        width: 32px;
        height: 32px;
        display: grid;
        place-items: center;
      }
      .chat-close:hover {
        background: #f3edf5;
      }
      .chat-target {
        display: flex;
        gap: 9px;
        align-items: center;
        margin: 14px 16px 0;
        padding: 8px 11px;
        min-height: 36px;
        border-radius: 9px;
        background: #f2ecf7;
        color: #664b80;
        font-size: 13px;
        font-weight: 600;
      }
      .chat-target svg {
        flex: none;
      }
      .chat-target span {
        white-space: nowrap;
        text-overflow: ellipsis;
        overflow: hidden;
      }
      #thread {
        flex: 1;
        min-height: 0;
        overflow: auto;
        overscroll-behavior: contain;
        margin: 0;
        padding: 18px 16px 9px;
        scrollbar-width: thin;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 16px;
      }
      .chat-entry {
        max-width: 94%;
        font-size: 14px;
        line-height: 1.58;
        color: #403746;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }
      .chat-entry.user {
        align-self: flex-end;
        border-radius: 13px 13px 3px 13px;
        padding: 9px 13px;
        background: #efe5f8;
        color: #493852;
        max-width: 86%;
      }
      .chat-by {
        display: block;
        font-size: 11px;
        font-weight: 650;
        color: #765a88;
        margin: 0 0 5px;
      }
      .chat-origin {
        display: block;
        margin: 0 0 5px;
        font-size: 11px;
        color: #817487;
      }
      #thread .chat-prompt {
        margin: 4px 0 2px;
        font-size: 16px;
        line-height: 1.45;
        font-weight: 600;
        color: #493c50;
      }
      .chat-suggestions {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
      }
      .chat-suggestions button,
      .chat-result,
      .chat-retry {
        border: 1px solid #e2d8e8;
        border-radius: 8px;
        background: #faf6fc;
        padding: 6px 10px;
        color: #694e7c;
        font-size: 12px;
        line-height: 1.4;
      }
      .chat-result {
        display: block;
        margin-top: 8px;
        border-color: #d7e5d0;
        background: #eff6eb;
        color: #496952;
      }
      .chat-result:after {
        content: " ↗";
      }
      .chat-retry {
        margin-top: 5px;
        display: block;
      }
      .chat-entry.error {
        color: #884c59;
      }
      #chat-form {
        margin: 4px 15px 15px;
      }
      .chat-input {
        display: flex;
        align-items: flex-end;
        gap: 8px;
        padding: 7px;
        border: 1px solid #d9ccde;
        border-radius: 12px;
        background: #fffcf8;
      }
      .chat-input:focus-within {
        border-color: #9878ae;
        box-shadow: 0 0 0 2px #eee6f2;
      }
      #compose #draft {
        border: 0;
        resize: none;
        min-height: 42px;
        height: 45px;
        padding: 4px 5px;
        line-height: 1.45;
        flex: 1;
        outline: 0;
        background: transparent;
        min-width: 0;
        font-size: 14px;
        color: #3e3541;
      }
      #compose-send {
        flex: none;
        display: grid;
        place-items: center;
        border: 0;
        border-radius: 50%;
        width: 33px;
        height: 33px;
        background: #705183;
        color: #fffcf4;
        margin: 0 0 1px;
      }
      #compose-send:disabled {
        opacity: 0.47;
        cursor: default;
      }
      @media (max-width: 640px) {
        #compose {
          top: 58px;
          right: 8px;
          max-height: calc(100dvh - 147px);
        }
      }
      .emote {
        position: fixed;
        z-index: 4;
        pointer-events: none;
        display: block;
        width: 48px;
        height: 48px;
        transform: translate(-50%, -50%);
        animation: float 1.55s ease-out forwards;
      }
      #board [data-action^="mark-"]:is(:hover, :focus-visible) [data-role="stamp-well"] {
        fill: #efe4f4;
      }
      @media (prefers-reduced-motion: no-preference) {
        #board [data-symbol^="tool/"] > path {
          transition: translate 0.14s ease;
        }
        #board [data-tool-button]:hover [data-symbol^="tool/"] > path {
          translate: 0 -1.5px;
        }
        #board .ink-landing {
          animation: ink-press 0.27s ease-out;
          transform-box: fill-box;
          transform-origin: center;
        }
        @keyframes ink-press {
          0% {
            scale: 1.23;
            opacity: 0.42;
          }
          45% {
            scale: 0.91;
          }
          72% {
            scale: 1.04;
          }
          100% {
            scale: 1;
            opacity: 1;
          }
        }
      }
      @keyframes float {
        0% {
          opacity: 0;
          transform: translate(-50%, -30%) scale(0.75);
        }
        15% {
          opacity: 1;
          transform: translate(-50%, -50%) scale(1.06);
        }
        100% {
          opacity: 0;
          transform: translate(-50%, -66px) scale(0.95);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .emote {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <svg
      id="board"
      xmlns="http://www.w3.org/2000/svg"
      role="application"
      aria-label="春日观察手账白板"
      tabindex="0"
    ></svg>
    <div id="menu" role="menu" hidden></div>
    <textarea id="editor" aria-label="编辑白板文字" spellcheck="false" hidden></textarea>
    <div id="hint" hidden></div>
    <div id="status" role="status" hidden></div>
    <dialog id="source">
      <div class="line">
        <h2 id="source-title"></h2>
        <button id="source-close" class="cross" aria-label="返回白板">×</button>
      </div>
      <p id="source-info"></p>
      <div id="source-body"></div>
      <button id="source-save" class="primary">保存并返回白板</button>
    </dialog>
    <aside id="compose" aria-label="AI 搭子聊天" hidden>
      <header class="chat-header">
        <span id="chat-mascot" aria-hidden="true"></span>
        <div>
          <h2 id="chat-name">AI 搭子</h2>
          <small id="chat-provider">本地演示</small>
        </div>
        <button
          id="compose-close"
          type="button"
          class="chat-close"
          aria-label="收起 AI 聊天"
          title="收起聊天"
        >
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <g
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.8"
            >
              <rect x="3" y="4" width="18" height="16" rx="3" />
              <path d="M15 4v16M7 9l3 3-3 3" />
            </g>
          </svg>
        </button>
      </header>
      <div class="chat-target">
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          aria-hidden="true"
        >
          <path
            d="M8 3H5a2 2 0 0 0-2 2v3m13-5h3a2 2 0 0 1 2 2v3M3 16v3a2 2 0 0 0 2 2h3m13-5v3a2 2 0 0 1-2 2h-3"
          /></svg
        ><span data-role="ai-target" id="compose-info"></span>
      </div>
      <div id="thread" role="log" aria-label="白板对话" aria-live="polite"></div>
      <form id="chat-form">
        <label class="chat-input">
          <textarea
            rows="2"
            id="draft"
            data-action="ai-compose"
            aria-label="给 AI 搭子发消息"
            placeholder="给 AI 搭子发消息…"
            spellcheck="false"
          ></textarea
          ><button id="compose-send" type="submit" title="发送" aria-label="发送消息">
            <svg width="19" height="19" viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M12 19V5m-6 6 6-6 6 6"
                fill="none"
                stroke="currentColor"
                stroke-width="2.1"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg></button
        ></label>
      </form>
    </aside>

    <main id="journal-workspace" aria-label="OfficeCLI 工作空间" hidden></main>
    <dialog id="ws-dialog"><header><h2></h2><button type="button" aria-label="关闭" data-close-dialog>×</button></header><div class="ws-dialog-content"></div></dialog>
    <div id="ws-notice" role="status" hidden></div>
    <script>
      let journalWorkspace = null;
      const assets = {
        book: {
          title: "书页",
          motion: "sway",
          svg: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6 -6 76 76" role="img" aria-label="book sticker"><title>book</title><style>@keyframes sway{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-2px) rotate(2deg)}}.motion{transform-origin:32px 32px;animation:sway 4.8s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.motion{animation:none}}</style><g class="motion"><rect fill="#A8C6D5" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" x="8" y="6" width="47" height="53" rx="8"/><rect fill="#D48260" stroke="none" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" x="12" y="7" width="6" height="51" rx="8"/><rect fill="#FFFCF4" stroke="none" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" x="23" y="16" width="25" height="25" rx="8"/><polyline fill="none" stroke="#484439" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="28,23 43,23"/><polyline fill="none" stroke="#484439" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" points="28,30 39,30"/><polyline fill="#E9A2A6" stroke="none" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" points="39,46 46,46 46,59 42,56 39,59 39,46"/></g></svg>\n',
          tags: ["reading", "lesson", "书本", "阅读", "课堂", "课程"],
          useWhen: "阅读计划、学习笔记",
          category: "sticker",
          motionLabel: "轻轻浮动",
        },
        butterfly: {

            [cx + Math.cos(a) * l, cy + Math.sin(a) * l].map((v) => Number(v.toFixed(2))).join(" ");

            start = -Math.PI / 2;
          let d = "M" + p(start, r - depth);
          for (let i = 0; i < count; i++)
            d +=
              " Q" +
              p(start + (i + 0.5) * step, r + depth) +
              " " +
              p(start + (i + 1) * step, r - depth);
          return d + " Z";

            drawUi();
            stash();
            return;
          }
          const members = new Set([...picked].map(lookup).filter(Boolean));

      });
      function previewGesture(n) {

        }

      }
      function strokeObject(points) {
        const b =
          brush === "柔光荧光笔"
            ? ["#E0B838", 9]
            : brush === "粉彩笔"
              ? ["#C284A0", 6]
              : brush === "钢笔"
                ? ["#40334F", 3]
                : brush === "双线笔"
                  ? ["#8871A4", 2]
                  : brush === "虚线笔"
                    ? ["#698E7C", 2]
                    : ["#726A76", 2];
        const x = Math.min(...points.map((p) => p.x)) - 3,
          y = Math.min(...points.map((p) => p.y)) - 3;
        const w = Math.max(6, Math.max(...points.map((p) => p.x)) - x + 3),
          h = Math.max(6, Math.max(...points.map((p) => p.y)) - y + 3);
        const path =
          points
            .map((p, i) => (i ? "L" : "M") + (p.x - x).toFixed(1) + " " + (p.y - y).toFixed(1))
            .join(" ") + (points.length === 1 ? "l.15 .15" : "");

      }
      svg.addEventListener("pointermove", (e) => {
        pointer = { x: e.clientX, y: e.clientY };
        const g = gesture;
        if (!g) return;
        const p = screenToWorld(e.clientX, e.clientY);
        if (g.kind === "pan") {
          pan = { x: g.pan.x + e.clientX - g.x, y: g.pan.y + e.clientY - g.y };
          updateCamera();
          return;
        }
        if (g.kind === "move") {
          const dx = (e.clientX - g.x) / scale(),
            dy = (e.clientY - g.y) / scale();
          if (!g.moved && Math.hypot(e.clientX - g.x, e.clientY - g.y) < 4) return;
          if (!g.moved) {
            svg.setPointerCapture(e.pointerId);
            checkpoint();
            g.moved = true;
          }
          for (const b of g.origins) {
            b.o.x = Math.round(b.x + dx);
            b.o.y = Math.round(b.y + dy);
          }
          paint();
          return;
        }
        if (g.kind === "mark-move" || g.kind === "stamp-resize") {
          const dx = p.x - g.p.x,
            dy = p.y - g.p.y;
          if (!g.moved && Math.hypot(dx, dy) < 2) return;
          if (!g.moved) {
            checkpoint();
            g.moved = true;
          }
          if (g.kind === "mark-move") anchorMark(g.m, g.position.x + dx, g.position.y + dy);
          else g.m.size = clamp(g.size + (dx + dy) / 2, 20, 124);

          return;
        }
        if (g.kind === "resize") {
          const v = g.original,
            dx = p.x - g.p.x,
            dy = p.y - g.p.y;
          if (!g.moved && Math.hypot(dx, dy) < 2) return;
          if (!g.moved) {
            checkpoint();
            g.moved = true;
          }
          const left = g.corner.includes("w"),
            top = g.corner.includes("n");
          const minW = g.o.type === "note" ? 88 : 30,
            minH = g.o.type === "note" ? 86 : 26;
          g.o.w = Math.max(minW, v.w + (left ? -dx : dx));
          g.o.h = Math.max(minH, v.h + (top ? -dy : dy));
          if (g.o.type === "asset") g.o.h = g.o.w;
          g.o.x = left ? v.x + v.w - g.o.w : v.x;

          return;
        }
        if (g.kind === "link") {
          if (Math.hypot(p.x - g.p.x, p.y - g.p.y) > 4) {
            g.dragged = true;
            previewGesture(
              D.path(
                "连线预览",
                0,
                0,
                1440,
                900,
                "M " + g.p.x + " " + g.p.y + " L " + p.x + " " + p.y,
                D.purple,
                2,
              ),
            );
          }
          return;
        }
        if (g.kind === "marquee") {
          const x = Math.min(g.p.x, p.x),
            y = Math.min(g.p.y, p.y),
            w = Math.abs(g.p.x - p.x),
            h = Math.abs(g.p.y - p.y);
          if (w + h < 5) return;
          const hits = data.objects.filter(
            (o) => o.x < x + w && o.x + o.w > x && o.y < y + h && o.y + o.h > y,
          );
          picked = new Set([...g.original, ...hits.map((o) => o.id)]);
          selected = [...picked].at(-1) || null;

            D.rect(

              Math.min(g.p.x, p.x),

              Math.abs(p.x - g.p.x),
              Math.abs(p.y - g.p.y),

      svg.addEventListener("pointerup", (e) => {
        const g = gesture;
        if (!g) return;

        if (svg.hasPointerCapture(e.pointerId)) svg.releasePointerCapture(e.pointerId);

          act(g.clickAction, objects.querySelector('[data-action="' + g.clickAction + '"]'), e);
          return;
        }
        if (g.kind === "stamp-place") {
          clearInterval(g.timer);
          placeStamp(g.x, g.y, false, g.size);
          return;
        }
        if (g.kind === "sticky-tool") {
          if (g.dragged) {
            createAt("sticky", p);
          } else chooseTool("sticky");
          return;
        }
        if (g.kind === "link") {
          if (g.dragged) {
            const hit = [...data.objects]
              .reverse()
              .find((o) => p.x >= o.x && p.x <= o.x + o.w && p.y >= o.y && p.y <= o.y + o.h);

          stash();
          render();
          return;
        }
        if (g.kind === "pen") {

          const o = { ...strokeObject(g.points), id: id() };
          data.objects.push(o);
          stash();
          render();
          return;
        }
        if (g.kind === "size") {
          createAt(g.t, g.p, Math.hypot(p.x - g.p.x, p.y - g.p.y) > 6 ? p : null);

      svg.addEventListener("pointercancel", () => {
        if (!gesture) return;

        gesture = null;

          for (const b of g.origins) {
            b.o.x = b.x;
            b.o.y = b.y;
          }

        }

      });
      svg.addEventListener("dblclick", (e) => {
        const a = e.target.closest("[data-action]")?.dataset.action;
        if (a?.startsWith("source-") && !source.open) {

          return;
        }
        if (tool !== "select" || e.target.closest("[data-action],[data-panel]")) return;

        "wheel",
        (e) => {

            stash();
          }

        { passive: false },
      );
      document.addEventListener("pointerdown", (e) => {
        if (!menu.hidden && !e.composedPath().includes(menu) && !e.composedPath().includes(svg))
          closeMenu();
      });
      document.addEventListener("keydown", (e) => {

          return;
        }
        if ((e.metaKey || e.ctrlKey) && k === "enter" && editTarget()?.type === "note") {
          e.preventDefault();

          createAt("sticky", { x: a.x + a.w + 22, y: a.y });

        }

            return;

          return;
        }

          e.preventDefault();
          space = true;
          updateCamera();
          return;
        }
        if (e.code === "Digit1" && e.shiftKey) {
          e.preventDefault();
          frameAll();
          return;
        }
        if (e.code === "Digit0" && e.shiftKey) {
          e.preventDefault();
          changeZoom(1);
          return;
        }
        if (e.key === "=" || e.key === "+") {
          e.preventDefault();
          changeZoom(zoom * 1.25);
          return;
        }
        if (e.key === "-") {
          e.preventDefault();
          changeZoom(zoom / 1.25);
          return;
        }
        if (k === "backspace" || k === "delete") {
          e.preventDefault();
          removeSelected();
          return;
        }
        if (k === "enter" && selected) {
          e.preventDefault();
          beginEdit(lookup(selected), true);
          return;
        }
        if (k === "?") {
          act("help", chrome.querySelector('[data-action="help"]'));
          return;
        }
        if (k === "r" || k === "o") shapeMode = k === "o" ? "ellipse" : "rect";
        if (k === "x" || k === "l") edgeMode = k === "l" && !e.shiftKey ? "straight" : "bent";
        if (k === "m") brush = e.shiftKey ? "柔光荧光笔" : "铅笔";
        const cmd = {
          v: "select",
          h: "hand",
          m: "pen",
          p: "pen",
          r: "shape",
          l: "connector",
          s: e.shiftKey ? "section" : "sticky",
          o: "shape",
          x: "connector",
          t: "text",
          e: "stamp",
          c: "comment",
        }[k];
        if (cmd) {
          e.preventDefault();
          chooseTool(cmd, pointer.x, pointer.y);
        }
      });
      document.addEventListener("keyup", (e) => {
        if (e.code === "Space") {
          space = false;
          updateCamera();
        }
      });
      window.addEventListener("blur", () => {
        space = false;

      });

      });

      function restoreSharedView(value) {
        if (!value) return;
        const camera = value.split(",").map(Number);
        if (camera.length !== 6 || !camera.every(Number.isFinite)) return;
        const [z, x, y, w, h, f] = camera;
        if (w <= 0 || h <= 0 || f <= 0) return;
        zoom = clamp(z, 0.15, 5);
        pan = { x: ((x - w / 2) * fit) / f + W / 2, y: ((y - h / 2) * fit) / f + H / 2 };

      }
    </script>
    <script src="./workspace.js"></script>
    <script>
      if (typeof createJournalWorkspace === "function") {
        function focusWorkspaceRef(ref) {
          if (!ref) return;
          if (ref === "doc" || ref === "sheet") {
            const card = objects.querySelector('[data-action="source-' + ref + '"]');
            if (!card) return;
            const b = card.getBoundingClientRect();
            if (b.left < 16 || b.right > W - 16 || b.top < 80 || b.bottom > H - 100) {
              pan.x += W * 0.45 - b.left - b.width / 2;
              pan.y += H * 0.59 - b.top - b.height / 2;
              updateCamera();
            }
            panel = "preview-" + ref;
            drawUi();
            return;
          }
          const o = lookup(ref);
          if (!o) return;
          select(o.id);
          const point = worldToScreen(o.x + o.w / 2, o.y + o.h / 2);
          pan.x += W / 2 - point.x;
          pan.y += H / 2 - point.y;
          render();
        }
        function knownReference(ref, owner = boardId) {
          return (
            boardScene(owner).objects.find(
              (o) =>
                o.type === "reference" && o.sourceRef?.id === ref.id && o.sourceRef.anchor === ref.anchor,
            )?.id || ""
          );
        }
        journalWorkspace = createJournalWorkspace({
          initialParagraph: () => data.doc,
          initialSheet: () => copy(data.sheet),
          activeBoard: () => boardId,
          switchBoard,
          embedded,
          setReferences(paragraph, cells) {
            const changed =
              data.doc !== paragraph || JSON.stringify(data.sheet) !== JSON.stringify(cells);
            data.doc = paragraph;
            data.sheet = copy(cells);
            if (changed) {
              try {
                const saved = JSON.parse(localStorage.getItem(key) || "null");
                if (saved) {
                  saved.doc = paragraph;
                  saved.sheet = cells;
                  localStorage.setItem(key, JSON.stringify(saved));
                }
              } catch {}
            }
            if (journalWorkspace && !journalWorkspace.isInWorkspace()) {
              paint();
              drawUi();
            }
          },
          refreshNames() {
            [resources[0].title, resources[1].title] = [
              journalWorkspace.title("campus-observations"),
              journalWorkspace.title("march-phenology"),
            ];

            chromeLayout = "";
            paint();
            drawUi();
          },
          cloneMark: () => companionTemplate.cloneNode(true),
          chatEnabled: chatAvailable,
          undockChat() {
            if (compose.parentElement !== document.body) document.body.append(compose);
          },
          refreshChat: syncChat,
          dockChat(slot) {
            chatOpen = !!slot && chatAvailable();
            if (chatOpen) slot.append(compose);
            syncChat();
          },
          leaveWorkspaceChat() {
            document.body.append(compose);
            chatOpen = false;
            syncChat();
          },
          parkBoard() {
            finishEdit();
            closeMenu();
            panel = "";
            space = false;
            chatOpen = false;
            syncChat();
            hint("");
            svg.inert = true;
            svg.setAttribute("aria-hidden", "true");
          },
          showBoard(ref, owner = demoBoard, viewPosition) {
            switchBoard(owner);
            svg.inert = false;
            svg.removeAttribute("aria-hidden");
            panel = "";
            render();
            restoreSharedView(viewPosition);
            focusWorkspaceRef(ref);
          },
          focusReference: focusWorkspaceRef,
          knownReference,
          references(owner) {
            return (owner ? [owner] : journalWorkspace?.boardIds() || [demoBoard]).flatMap((id) =>
              boardScene(id)
                .objects.filter((o) => o.type === "reference" && o.sourceRef)
                .map((o) => ({ ...o.sourceRef, board: id, card: o.id })),
            );
          },
          makeReference(ref, author) {
            const existing = knownReference(ref);
            if (existing) return existing;
            const size = { w: 265, h: 154 },
              point = nearestFree(size.w, size.h);
            checkpoint();
            const o = {
              id: id(),
              type: "reference",
              label: ref.title,
              sourceRef: { ...ref },
              author,
              ...size,
              ...point,
            };
            data.objects.push(o);
            stash();
            return o.id;
          },
        });
        journalWorkspace.start();
      }
