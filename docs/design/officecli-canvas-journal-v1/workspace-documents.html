<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>文档空间 · OfficeCLI</title>
  </head>
  <body>
    <a href="./figjam-board.html#/library/documents">打开文档空间</a>
    <script>
      const entry = new URL(document.querySelector("a").href);
      entry.search = location.search;
      if (location.hash) entry.hash = location.hash;
      location.replace(entry.href);
    </script>
  </body>
</html>
