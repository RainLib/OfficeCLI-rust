<a href="previews/65-bulk-theme.png" target="_blank"><img src="previews/65-bulk-theme.png" alt="批量指定文档主题" loading="lazy"><span>65 · 批量指定文档主题</span></a></main><section aria-label="当前页面"><img id="detail" src="previews/49-overview.png" alt="工作空间概览"></section><script>const select=document.querySelector('#pages'),img=document.querySelector('#detail');function show(){img.src=select.value;img.alt=select.options[select.selectedIndex].text;document.body.classList.add('single');document.querySelector('#toggle').textContent='返回总览'}select.onchange=show;document.querySelector('#toggle').onclick=()=>{document.body.classList.toggle('single');document.querySelector('#toggle').textContent=document.body.classList.contains('single')?'返回总览':'切换单页'};function step(n){select.selectedIndex=(select.selectedIndex+n+select.options.length)%select.options.length;show()}document.querySelector('#prev').onclick=()=>step(-1);document.querySelector('#next').onclick=()=>step(1);document.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT')return;if(e.key==='ArrowLeft')step(-1);if(e.key==='ArrowRight')step(1)});</script></html>
