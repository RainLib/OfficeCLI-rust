<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>行内格式转换回归</title></head>
<body>
<h2><em style="font-weight:bold;font-style:normal">同名😀</em><em style="font-weight:normal;font-style:italic"> tail</em><span style="font-weight:normal;font-style:normal"> plain</span></h2>
<p><i>同名😀</i> tail plain</p>
<p># literal **stars** | 中文😀<br>下一行 <a href="https://example.com/?a=1&amp;b=2"><strong>链接</strong><i>文字</i></a> 完成</p>
<table><tr><th>标题</th><th>数值</th></tr><tr><td><em>单元格😀</em></td><td><strong>280</strong></td></tr></table>
<img alt="回归图片" width="64" height="64" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR4nGNgaPj/HwAEggJ/59habAAAAABJRU5ErkJggg==">
</body>
</html>
