services:
  workspace:
    image: &foldly_image ${FOLDLY_IMAGE:-foldly-workspace:local}
    build: &foldly_build
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      collaboration:
        condition: service_started
    init: true
    restart: unless-stopped
    stop_grace_period: 140s
    shm_size: 256m
    security_opt:
      - no-new-privileges:true
      - seccomp=./deploy/workspace/chromium-seccomp.json
    env_file:
      - path: ${FOLDLY_RUNTIME_ENV_FILE:-./.foldly.runtime.env}
        required: false
    environment:
      FOLDLY_PUBLIC_URL: ${FOLDLY_PUBLIC_URL:-http://localhost:7400}
      FOLDLY_INTERNAL_PORT: ${FOLDLY_INTERNAL_PORT:-7400}
      FOLDLY_ADMIN: ${FOLDLY_ADMIN:-admin}
      FOLDLY_WORKSPACE_NAME: ${FOLDLY_WORKSPACE_NAME:-Foldly 工作空间}
      FOLDLY_SELECTION_MCP: ${FOLDLY_SELECTION_MCP:-false}
      FOLDLY_DATABASE: postgres
      FOLDLY_DATABASE_URL_FILE: /run/secrets/foldly_database_url
      FOLDLY_COLLABORATION_SERVICE: collaboration
      FOLDLY_COLLABORATION_BRIDGE_PORT: ${FOLDLY_COLLABORATION_BRIDGE_PORT:-7403}
      FOLDLY_COLLABORATION_KEY_FILE: /run/foldly-collaboration/key
    volumes:
      - workspace_data:/var/lib/foldly
      - collaboration_credentials:/run/foldly-collaboration
    secrets:
      - foldly_admin_password
      - foldly_database_url
    networks:
      - default
      - collaboration

  collaboration:
    image: *foldly_image
    build: *foldly_build
    command: ["collaboration"]
    user: node
    init: true
    restart: unless-stopped
    stop_grace_period: 120s
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      HCD_API_URL: http://workspace:${FOLDLY_COLLABORATION_BRIDGE_PORT:-7403}
      HCD_COLLAB_BIND: 0.0.0.0
      HCD_COLLAB_PORT: 7402
      FOLDLY_COLLABORATION_KEY_FILE: /run/foldly-collaboration/key
    volumes:
      - collaboration_credentials:/run/foldly-collaboration:ro
    networks:
      - collaboration
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7402/',{signal:AbortSignal.timeout(2500)}).then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      start_period: 30s
      retries: 24

  postgres:
    image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -ec
      - |
        FOLDLY_POSTGRES_APP_PASSWORD=$$(cat /run/secrets/foldly_database_password)
        export FOLDLY_POSTGRES_APP_PASSWORD
        exec docker-entrypoint.sh postgres
    environment:
      POSTGRES_DB: foldly
      POSTGRES_PASSWORD_FILE: /run/secrets/foldly_database_admin
    volumes:
      - foldly_postgres:/var/lib/postgresql/data
      - ./deploy/workspace/postgres-init.sql:/docker-entrypoint-initdb.d/10-foldly.sql:ro
    secrets:
      - foldly_database_admin
      - foldly_database_password
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "foldly", "-d", "foldly"]
      interval: 5s
      timeout: 3s
      retries: 24

  proxy:
    image: caddy:2.11-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    restart: unless-stopped
    depends_on:
      workspace:
        condition: service_healthy
    environment:
      FOLDLY_PROXY_SITE: ${FOLDLY_PROXY_SITE:-:80}
      FOLDLY_INTERNAL_PORT: ${FOLDLY_INTERNAL_PORT:-7400}
    ports:
      - "${FOLDLY_LISTEN_ADDR:-127.0.0.1}:${FOLDLY_HTTP_PORT:-7400}:80"
      - "${FOLDLY_LISTEN_ADDR:-127.0.0.1}:${FOLDLY_HTTPS_PORT:-7443}:443"
    volumes:
      - ./deploy/workspace/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  workspace_data:
  collaboration_credentials:
  foldly_postgres:
  caddy_data:
  caddy_config:

networks:
  collaboration:
    internal: true

secrets:
  foldly_admin_password:
    file: ${FOLDLY_ADMIN_PASSWORD_FILE:-./.secrets/foldly-admin-password}
  foldly_database_admin:
    file: ${FOLDLY_DATABASE_ADMIN_PASSWORD_FILE:-./.secrets/foldly-database-admin}
  foldly_database_password:
    file: ${FOLDLY_DATABASE_PASSWORD_FILE:-./.secrets/foldly-database-password}
  foldly_database_url:
    file: ${FOLDLY_DATABASE_URL_FILE:-./.secrets/foldly-database-url}
