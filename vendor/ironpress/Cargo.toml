[package]
edition = "2024"
rust-version = "1.88"
name = "ironpress"
version = "1.6.0"
build = false
exclude = [
    ".github/",
    ".claude/",
    "target/",
    "docs/",
    "bindings/",
    "font-packs/",
    "dist/",
    "tests/parity/",
    "scripts/",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Pure Rust HTML/CSS/Markdown to PDF converter with layout engine, LaTeX math, tables, images, custom fonts, and streaming output. No browser, no system dependencies."
documentation = "https://docs.rs/ironpress"
readme = "README.md"
keywords = [
    "pdf",
    "html",
    "css",
    "markdown",
    "converter",
]
categories = [
    "text-processing",
    "encoding",
    "template-engine",
]
license = "MIT"
repository = "https://github.com/gastongouron/ironpress"

[features]
async = ["tokio"]
default = []
remote = [
    "bogon",
    "core-net",
    "ureq",
    "url",
]
wasm = [
    "wasm-bindgen",
    "js-sys",
    "getrandom/wasm_js",
]

[lib]
name = "ironpress"
crate-type = [
    "cdylib",
    "rlib",
]
path = "src/lib.rs"

[[bin]]
name = "ironpress"
path = "src/bin/cli.rs"

[[test]]
name = "feature_parity"
path = "tests/feature_parity.rs"

[[test]]
name = "font_packs"
path = "tests/font_packs.rs"

[[test]]
name = "pdf_smoke_tests"
path = "tests/pdf_smoke_tests.rs"

[[test]]
name = "proptest_properties"
path = "tests/proptest_properties.rs"

[[bench]]
name = "conversion"
path = "benches/conversion.rs"
harness = false

[dependencies.bogon]
