<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>footnote styling pseudos</title><style>
@page{size:208px 144px;margin:8px;@footnote{border-top:8px solid #111;padding-top:8px}}
html{font-family:ParitySans;line-height:1.5;font-size:12px}
*{margin:0;box-sizing:border-box}
p{background:#fef3c7}.fn{float:footnote}::footnote-call{content:"[" counter(footnote) "]";color:#ef476f;font-size:80%;font-variant-position:normal;vertical-align:baseline}::footnote-marker{content:"N" counter(footnote) ": ";color:#1d4ed8}
</style></head><body><p>Body text<span class="fn">styled footnote body</span> continues.</p></body></html>
