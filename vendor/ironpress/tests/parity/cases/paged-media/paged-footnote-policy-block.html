<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>footnote policy block</title><style>
@page{size:200px 144px;margin:16px}
html{font-family:ParitySans;line-height:1.5;font-size:12px}
*{margin:0;box-sizing:border-box}
.lead{height:64px;background:#dbeafe}
p{height:40px;font-size:0;line-height:20px;background:#fde68a}
.fn{float:footnote;footnote-policy:block;font-size:12px;color:#fff}
::footnote-call{color:#fde68a}::footnote-marker{content:""}
</style></head><body><div class="lead"></div><p>Paragraph with footnote<span class="fn">large note large note large note large note</span><br>second line</p></body></html>
