<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    @page { size: 220px 160px; margin: 0; }

    html { font-family: ParitySans; line-height: 1.5; }

    * { box-sizing: border-box; margin: 0; }

    body {
      padding: 12px;
      background: #fff;
      font-size: 20px;
      line-height: 30px;
    }

    /* Isolate target-counter from implementation-specific link defaults. */
    a { color: #111; text-decoration: none; }

    a::after {
      content: ' p.' target-counter(attr(href), page);
      color: #d7263d;
    }

    .spacer { height: 120px; }

    /* The target exists to establish a page, not to test UA heading defaults. */
    h1 { font-size: 20px; font-weight: 400; line-height: 30px; }
  </style>
</head>
<body>
  <a href="#target">See target</a>
  <div class="spacer"></div>
  <h1 id="target">Target</h1>
</body>
</html>
